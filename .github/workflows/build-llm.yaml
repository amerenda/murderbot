name: Build llm container

on:
  push:
    branches: [main]
    paths:
      - 'llm/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: llm/
          push: true
          tags: |
            ghcr.io/amerenda/murderbot-llm:latest
            ghcr.io/amerenda/murderbot-llm:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/amerenda/murderbot-llm:buildcache
          cache-to: type=registry,ref=ghcr.io/amerenda/murderbot-llm:buildcache,mode=max
