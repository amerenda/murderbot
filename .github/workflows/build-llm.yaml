name: Build llm container

on:
  push:
    branches: [main]
    paths:
      - 'llm/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: llm/
          push: true
          tags: |
            amerenda/murderbot-llm:latest
            amerenda/murderbot-llm:${{ github.sha }}
          cache-from: type=registry,ref=amerenda/murderbot-llm:buildcache
          cache-to: type=registry,ref=amerenda/murderbot-llm:buildcache,mode=max
